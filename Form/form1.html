<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Student Registration Form</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    body {
      background-color: #f8d7da;
     

    }
    .form-container {
      background-color: #b3e5fc;
      padding: 35px;
      max-width: 1250px;
      margin: 40px auto;
    }
    .form-container h2 {
      text-align: center;
    }
    .btn-register {
      background-color: #4CAF50;
      color: white;
      width: 100%;
    }
  </style>
</head>
<body>
  <div class="form-container shadow">
    <h2>Student Registeration Form</h2>
    <hr class="border border-white border-2 border-bottom">
    <form >
      <div class="mb-3">
        <label for="firstname" class="form-label">Firstname:</label>
        <input type="text" class="form-control" id="firstname" placeholder="Firstname">
      </div>
      <div class="mb-3">
        <label for="middlename" class="form-label">Middlename:</label>
        <input type="text" class="form-control" id="middlename" placeholder="Middlename">
      </div>
      <div class="mb-3">
        <label for="lastname" class="form-label">Lastname:</label>
        <input type="text" class="form-control" id="lastname" placeholder="Lastname">
      </div>
      <div class="mb-3">
        <label for="course" class="form-label">Course:</label>
        <select class="form-select" id="course">
          <option selected disabled>Course</option>
          <option>BSC.CS</option>
          <option>BTECH</option>
          <option>BSC.IT</option>
        </select>
      </div>
      <div class="mb-3">
        <label class="form-label d-block">Gender:</label>
        <div class="form-check form-check-inline">
          <input class="form-check-input" type="radio" name="gender" id="male" value="Male">
          <label class="form-check-label" for="male">Male</label>
        </div>
        <div class="form-check form-check-inline">
          <input class="form-check-input" type="radio" name="gender" id="female" value="Female">
          <label class="form-check-label" for="female">Female</label>
        </div>
        <div class="form-check form-check-inline">
          <input class="form-check-input" type="radio" name="gender" id="other" value="Other">
          <label class="form-check-label" for="other">Other</label>
        </div>
      </div>
      <div class="mb-3">
        <label for="phonecode" class="form-label">Phone:</label>
        <div class="input-group">
          <span class="input-group-text">+91</span>
          <input type="text" class="form-control" id="phonecode" placeholder="phone no.">
        </div>
      </div>
      <div class="mb-3">
        <label for="address" class="form-label">Current Address:</label>
        <textarea class="form-control" id="address" rows="3" placeholder="Current Address"></textarea>
      </div>
      <div class="mb-3">
        <label for="email" class="form-label">Email:</label>
        <input type="email" class="form-control" id="email" placeholder="Enter Email">
      </div>
      <div class="mb-3">
        <label for="password" class="form-label">Password:</label>
        <input type="password" class="form-control" id="password" placeholder="Enter Password">
      </div>
      <div class="mb-3">
        <label for="retypePassword" class="form-label">Re-type Password:</label>
        <input type="password" class="form-control" id="retypePassword" placeholder="Retype Password">
      </div>
      <button type="submit" class="btn btn-register">Register:</button>
    </form>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
