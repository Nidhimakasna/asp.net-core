
<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Registration Form</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    body {
      background-color:  blue;
    }
    .form-container {
      background-color: white;
      padding: 30px;
      max-width: 850px;
      margin: 40px auto;
      border-radius: 8px;

    }
    .btn-register {
      background-color: #3B82F6;
      color: white;
      width: 30%;
    }
  </style>
</head>
<body>

<div class="form-container">
  <form>
    <h4>Registration</h4>
    <h5 class="text-muted">Personal Details</h5>

    <div class="row mb-3">
      <div class="col-md-4">
        <label>Full Name:</label>
        <input type="text" class="form-control" placeholder="Enter your name">
      </div>
      <div class="col-md-4">
        <label>Date of Birth:</label>
        <input type="text" class="form-control" placeholder="Enter birth date">
      </div>
      <div class="col-md-4">
        <label>Email:</label>
        <input type="email" class="form-control" placeholder="Enter your email">
      </div>
    </div>

    <div class="row mb-3">
      <div class="col-md-4">
        <label>Mobile Number:</label>
        <input type="tel" class="form-control" placeholder="Enter mobile number">
      </div>
      <div class="col-md-4">
        <label>Gender:</label>
        <input type="text" class="form-control" placeholder="Enter your gender">
      </div>
      <div class="col-md-4">
        <label>Occupation:</label>
        <input type="text" class="form-control" placeholder="Enter occupation">
      </div>
    </div>

    <h5 class="text-muted">Identity Details</h5>

    <div class="row mb-3">
      <div class="col-md-4">
        <label>ID Type:</label>
        <input type="text" class="form-control" placeholder="Enter ID type">
      </div>
      <div class="col-md-4">
        <label>ID Number:</label>
        <input type="text" class="form-control" placeholder="Enter ID number">
      </div>
      <div class="col-md-4">
        <label>Issue Authority:</label>
        <input type="text" class="form-control" placeholder="Enter issue authority">
      </div>
    </div>

    <div class="row mb-3">
      <div class="col-md-4">
        <label>Issue Date:</label>
        <input type="text" class="form-control" placeholder="Enter ID issue date">
      </div>
      <div class="col-md-4">
        <label>Issue State:</label>
        <input type="text" class="form-control" placeholder="Enter ID issue state">
      </div>
      <div class="col-md-4">
        <label>Expiry Date:</label>
        <input type="text" class="form-control" placeholder="Enter ID expiry date">
      </div>
    </div>

    <div class="text-start">
      <button type="submit" class="btn btn-register">Next ➜</button>
    </div>
  </form>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
